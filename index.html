<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Vehicle cost comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Прилагаме запазената тема преди рендер, за да няма премигване
  // Apply saved theme before first paint to avoid a flash
  (function(){try{var p=localStorage.getItem('vc-theme');if(p==='light'||p==='dark')document.documentElement.setAttribute('data-theme',p);}catch(e){}})();
</script>
<style>
/* ============ ТОКЕНИ / TOKENS ============ */
:root{
  --bg:#EEF1F5;
  --panel:#FFFFFF;
  --panel-2:#F5F7FA;
  --ink:#141A26;
  --ink-2:#4A5568;
  --ink-3:#687284;
  --line:#D9DEE6;
  --line-strong:#B6BFCC;
  --a:#2347C5;            /* Превозно средство 1 / Vehicle 1 */
  --b:#B45309;            /* Превозно средство 2 / Vehicle 2 */
  --focus:#1D64F0;
  --shadow:0 -6px 20px rgba(20,26,38,.10);
  --font:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1018; --panel:#141A25; --panel-2:#1B2230;
    --ink:#E9EDF3; --ink-2:#B3BCCB; --ink-3:#8D97A8;
    --line:#283142; --line-strong:#3A4558;
    --a:#7D9BFF; --b:#F2A33A; --focus:#8AB4FF;
    --shadow:0 -6px 20px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1018; --panel:#141A25; --panel-2:#1B2230;
  --ink:#E9EDF3; --ink-2:#B3BCCB; --ink-3:#8D97A8;
  --line:#283142; --line-strong:#3A4558;
  --a:#7D9BFF; --b:#F2A33A; --focus:#8AB4FF;
  --shadow:0 -6px 20px rgba(0,0,0,.45);
  color-scheme:dark;
}

/* ============ ОСНОВА / BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 15px/1.5 var(--font);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.page{max-width:1280px;margin:0 auto;padding:28px 24px 64px}

/* ============ ЗАГЛАВИЕ / HEADER ============ */
.top{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:16px 24px;flex-wrap:wrap;margin-bottom:22px;
}
.top h1{margin:0;font-size:1.65rem;line-height:1.2;font-weight:600;letter-spacing:-.015em}
.top p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;
  background:var(--panel);border:1px solid var(--line-strong);border-radius:6px;
  font-size:.875rem;font-weight:500;cursor:pointer;color:var(--ink);
}
.btn:hover{background:var(--panel-2)}
.btn svg{flex-shrink:0}
.btn.done{border-color:var(--ink)}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);overflow:hidden}
.seg button{
  height:32px;min-width:34px;padding:0 10px;border:0;background:transparent;
  color:var(--ink-2);font-size:.8125rem;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.seg button + button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink);background:var(--panel-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg.sm button{height:28px;font-weight:500}

/* ============ ОФОРМЛЕНИЕ / LAYOUT ============ */
.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.inputs{display:flex;flex-direction:column;gap:20px;min-width:0}
.results{position:sticky;top:16px;min-width:0}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.panel-h h2{margin:0;font-size:1rem;font-weight:600}
.panel-h p{margin:0;font-size:.8125rem;color:var(--ink-3)}

/* ============ ЧИСЛОВИ ПОЛЕТА / NUMBER FIELDS ============ */
.num{
  display:flex;align-items:center;width:100%;min-width:0;
  background:var(--panel-2);border:1px solid var(--line-strong);border-radius:6px;
  cursor:text;
}
.num input{
  flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;
  padding:6px 4px 6px 9px;text-align:right;font-weight:600;
  font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;appearance:textfield;
}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num .u{padding:0 9px 0 4px;color:var(--ink-3);font-size:.8125rem;white-space:nowrap}
.num:hover{border-color:var(--ink-3)}
.num:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent)}

/* ============ ПРОБЕГ И ЦЕНИ / USAGE AND PRICES ============ */
.ctl{
  display:grid;grid-template-columns:11.5rem minmax(0,1fr) 8.5rem;
  grid-template-areas:"l r n";gap:6px 16px;align-items:center;padding:10px 18px;
}
.ctl + .ctl{border-top:1px solid var(--line)}
.ctl-l{grid-area:l;font-size:.9rem;color:var(--ink-2)}
.ctl .rng{grid-area:r}
.ctl .num{grid-area:n}

.rng{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;margin:0;
  background:linear-gradient(to right, var(--ink) 0 var(--p,50%), var(--line) var(--p,50%) 100%);
  cursor:pointer;
}
.rng::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--panel);border:2px solid var(--ink);
}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--ink)}
.rng::-moz-range-track{background:transparent}
.rng:focus-visible{outline-offset:6px}

/* ============ СПЕЦИФИКАЦИЯ / SPEC SHEET ============ */
.sheet{display:grid;grid-template-columns:minmax(8.5rem,.9fr) minmax(0,1.15fr) minmax(0,1.15fr)}
.cell{padding:8px 12px;border-top:1px solid var(--line);min-width:0;display:flex;flex-direction:column;justify-content:flex-start}
.cell.lbl{padding-left:18px;padding-top:15px;font-size:.875rem;line-height:1.3;color:var(--ink-2)}
.cell.v2{padding-right:18px}
.cell.corner,.cell.vh{border-top:0;padding-top:14px;padding-bottom:12px}
.cell.vh{box-shadow:inset 0 3px 0 var(--c)}
.cell.na{color:var(--ink-3);text-align:center;padding-top:14px}
.grp{
  grid-column:1/-1;padding:12px 18px 6px;font-size:.875rem;font-weight:600;
  background:var(--panel-2);border-top:1px solid var(--line);
}
.name{
  width:100%;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);
  padding:7px 9px;font-size:1rem;font-weight:600;outline:none;
}
.name:hover{border-color:var(--ink-3)}
.name:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent)}
.cap{font-size:.75rem;color:var(--ink-3);margin-top:3px;text-align:right}

.sel-wrap{position:relative;width:100%}
.sel-wrap::after{
  content:'';position:absolute;right:12px;top:50%;width:7px;height:7px;pointer-events:none;
  border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);
  transform:translateY(-70%) rotate(45deg);
}
.sel{
  width:100%;-webkit-appearance:none;appearance:none;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line-strong);border-radius:6px;
  padding:6px 30px 6px 9px;font-size:.9rem;font-weight:500;
}
.sel:hover{border-color:var(--ink-3)}

/* ============ РЕЗУЛТАТИ / RESULTS ============ */
.verdict{padding:20px 22px 14px;box-shadow:inset 4px 0 0 var(--win,var(--ink))}
.verdict h2{
  margin:0;font-size:clamp(1.35rem, 1rem + 1.1vw, 1.85rem);line-height:1.22;font-weight:600;
  letter-spacing:-.015em;font-variant-numeric:tabular-nums;text-wrap:balance;
}
.verdict p{margin:8px 0 0;color:var(--ink-2);font-size:.9rem}

.bars{padding:2px 22px 4px}
.bar-row{margin-top:14px}
.bar-head{display:flex;justify-content:space-between;gap:12px;font-size:.875rem;margin-bottom:6px}
.bar-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.bar-total{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-track{position:relative;height:22px;display:flex;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar-track span{height:100%}
.s-p{background:var(--c)}
.s-e{background:var(--c);opacity:.62}
.s-f{background:var(--c);opacity:.32}
.s-p,.s-e{box-shadow:inset -2px 0 0 var(--panel)}
.resale{position:absolute;top:0;background:repeating-linear-gradient(-45deg, var(--panel) 0 2.5px, transparent 2.5px 6px)}
.tick{position:absolute;top:0;width:2px;background:var(--ink)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 22px 16px;margin:0;list-style:none;font-size:.78rem;color:var(--ink-2)}
.legend li{display:flex;align-items:center;gap:6px}
.key{width:14px;height:10px;border-radius:2px;background:var(--ink-2);display:inline-block}
.key.e{opacity:.62}.key.f{opacity:.32}
.key.r{background:repeating-linear-gradient(-45deg, var(--panel) 0 2px, var(--ink-2) 2px 5px);border:1px solid var(--ink-3)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex-shrink:0}

.figures{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);border-top:1px solid var(--line)}
.mini{padding:12px 22px 14px}
.mini table{width:100%;border-collapse:collapse;font-size:.875rem;table-layout:fixed}
.mini th:first-child,.mini td:first-child{width:38%}
.mini th{font-weight:500;color:var(--ink-3);text-align:right;padding:2px 0 6px 10px;font-size:.78rem}
.mini th:first-child{text-align:left;padding-left:0}
.mini td{padding:5px 0 5px 10px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini td:first-child{text-align:left;padding-left:0;font-weight:400;color:var(--ink-2);white-space:normal}
.mini tr + tr td{border-top:1px solid var(--line)}
.mini .h-name{display:inline-flex;align-items:center;gap:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.be{padding:12px 22px 14px;border-left:1px solid var(--line)}
.be .k{margin:0;font-size:.8125rem;color:var(--ink-2)}
.be .v{margin:2px 0 4px;font-size:1.45rem;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.be .s{margin:0;font-size:.8125rem;color:var(--ink-2);line-height:1.45}

.chart-block{border-top:1px solid var(--line);padding:14px 14px 10px}
.chart-block h3{margin:0 8px 8px;font-size:.875rem;font-weight:600}
.chart-wrap{position:relative;height:250px}

/* ============ РАЗБИВКА / BREAKDOWN ============ */
.breakdown{margin-top:20px}
.tbl-wrap{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
.tbl th,.tbl td{padding:9px 18px;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl thead th{font-weight:600;border-bottom:1px solid var(--line-strong)}
.tbl thead .h-name{display:inline-flex;align-items:center;gap:7px}
.tbl tbody td{border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tbody td:first-child{color:var(--ink-2)}
.tbl tbody td:not(:first-child){font-weight:500}
.tbl .g th{background:var(--panel-2);font-size:.8125rem;font-weight:600;padding-top:10px;padding-bottom:7px;border-top:1px solid var(--line)}
.tbl .total td{border-top:2px solid var(--line-strong);font-weight:700;color:var(--ink)}
.tbl .total td:first-child{color:var(--ink)}
.diff{position:relative;display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}
.muted{color:var(--ink-3)}

/* ============ МОБИЛНА ЛЕНТА / MOBILE BAR ============ */
.mbar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:11px 18px calc(11px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border-top:1px solid var(--line);box-shadow:var(--shadow);
  font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums;
  transform:translateY(110%);transition:transform .2s ease;
}
.mbar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--win,var(--ink))}
.mbar.show{transform:none}

/* ============ АДАПТИВНОСТ / RESPONSIVE ============ */
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  .results{position:static;order:-1}
  .mbar{display:block}
}
@media (max-width:600px){
  .page{padding:20px 14px 80px}
  .top h1{font-size:1.4rem}
  .ctl{grid-template-columns:minmax(0,1fr) 8rem;grid-template-areas:"l n" "r r";padding:10px 14px 14px}
  .sheet{grid-template-columns:1fr 1fr}
  .cell.corner{display:none}
  .cell.lbl{grid-column:1/-1;padding:10px 14px 2px}
  .cell.v,.cell.na{border-top:0;padding:4px 14px 10px}
  .cell.v + .cell.v,.cell.v + .cell.na,.cell.na + .cell.v{padding-left:6px}
  .cell.na{padding-top:11px}
  .cell.vh{padding:12px 6px 12px 14px}
  .cell.vh.v2{padding-left:6px}
  .cell.v2{padding-right:14px}
  .grp{padding:10px 14px 6px}
  .verdict,.bars,.legend,.mini,.be{padding-left:16px;padding-right:16px}
  .figures{grid-template-columns:minmax(0,1fr)}
  .panel-h{flex-direction:column;align-items:flex-start;gap:2px}
  .be{border-left:0;border-top:1px solid var(--line)}
  .tbl th,.tbl td{padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media print{
  .controls,.mbar{display:none!important}
  .results{position:static}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <div>
      <h1 id="title">Vehicle cost comparison</h1>
      <p id="subtitle"></p>
    </div>
    <div class="controls">
      <button type="button" class="btn" id="shareBtn" aria-live="polite">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span id="shareLbl">Copy link</span>
      </button>
      <button type="button" class="btn" id="resetBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
        <span id="resetLbl">Reset</span>
      </button>
      <div class="seg" id="themeSeg" role="group" aria-label="Theme">
        <button type="button" data-theme-opt="auto" aria-pressed="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
          <span class="sr"></span>
        </button>
        <button type="button" data-theme-opt="light" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="sr"></span>
        </button>
        <button type="button" data-theme-opt="dark" aria-pressed="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span class="sr"></span>
        </button>
      </div>
      <div class="seg" id="langSeg" role="group" aria-label="Език / Language">
        <button type="button" data-lang="bg" aria-pressed="false">БГ</button>
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <div class="inputs">
      <section class="panel" aria-labelledby="hVehicles">
        <div class="panel-h"><h2 id="hVehicles"></h2></div>
        <div class="sheet" id="sheet"></div>
      </section>

      <section class="panel" aria-labelledby="hUsage">
        <div class="panel-h"><h2 id="hUsage"></h2><p id="hUsageNote"></p></div>
        <div id="usage"></div>
      </section>
    </div>

    <section class="results panel" aria-live="polite">
      <div class="verdict" id="verdict">
        <h2 id="verdictText"></h2>
        <p id="verdictSub"></p>
      </div>
      <div class="bars" id="bars" role="img"></div>
      <ul class="legend" id="legend"></ul>
      <div class="figures">
        <div class="mini" id="mini"></div>
        <div class="be" id="be"></div>
      </div>
      <div class="chart-block" id="chartBlock">
        <h3 id="chartTitle"></h3>
        <div class="chart-wrap"><canvas id="costChart" role="img"></canvas></div>
      </div>
    </section>
  </div>

  <section class="panel breakdown" aria-labelledby="hBreakdown">
    <div class="panel-h"><h2 id="hBreakdown"></h2></div>
    <div class="tbl-wrap"><table class="tbl" id="tbl"></table></div>
  </section>

</div>

<div class="mbar" id="mbar" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){
  'use strict';

  // ============ ПРЕВОДИ / TRANSLATIONS ============
  const T = {
    en: {
      title:'Vehicle cost comparison',
      subtitle:'Purchase, energy, running costs and resale value of two vehicles, side by side.',
      copyLink:'Copy link', copied:'Link copied', copyPrompt:'Copy this link:', reset:'Reset',
      themeAria:'Colour theme', themeAuto:'Match system', themeLight:'Light', themeDark:'Dark',
      v1Default:'Vehicle 1', v2Default:'Vehicle 2',
      vehicles:'Vehicles', usage:'Usage and prices', usageNote:'Shared by both vehicles',
      nameAria:'Vehicle name',
      fuelType:'Fuel type', hybridBase:'Hybrid runs on',
      grpPurchase:'Purchase and resale', grpEnergy:'Energy use', grpFixed:'Fixed costs per year',
      grpOver:'Over {n} {years}',
      purchase:'Purchase price', subsidy:'Subsidy or discount', charger:'Charger installation',
      residual:'Resale value at end', consumption:'Consumption', secondary:'Second consumption',
      maint:'Maintenance', insurance:'Insurance', roadTax:'Vignette and tolls', vehicleTax:'Vehicle tax',
      diesel:'Diesel', petrol:'Petrol', cng:'CNG', lpg:'LPG', hybrid:'Hybrid', dieseladblue:'Diesel + AdBlue', electric:'Electric',
      capPetrol:'petrol', capElectricity:'electricity', capDiesel:'diesel',
      kmMonth:'Distance per month', years:'Period of use',
      dieselPrice:'Diesel price', petrolPrice:'Petrol price', lpgPrice:'LPG price', cngPrice:'CNG price', adbluePrice:'AdBlue price', elPrice:'Electricity price',
      uKm:'km', uEur:'€', uEurYr:'€/yr', uPct:'% of price', uL:'€/L', uKg:'€/kg', uKwh:'€/kWh', uYrs:'yrs',
      uL100:'L/100 km', uKg100:'kg/100 km', uKwh100:'kWh/100 km', uL1000:'L/1000 km',
      verdictWin:'{name} is cheaper by {amount} over {n} {years}',
      verdictEqual:'Both cost the same over {n} {years}',
      verdictSub:'Net cost of ownership at {km} per month, after resale value.',
      segPurchase:'Purchase', segEnergy:'Energy', segFixed:'Fixed costs', segResale:'Resale value (deducted)',
      barsAria:'Net total cost: {a} {va}, {b} {vb}',
      monthlyCost:'Monthly cost', perKm:'Total cost per km',

    bg: {

      segPurchase:'Покупка', segEnergy:'Енергия', segFixed:'Фиксирани разходи', segResale:'Остатъчна стойност (приспада се)',
      barsAria:'Обща нетна стойност: {a} {va}, {b} {vb}',
      monthlyCost:'Месечен разход', perKm:'Обща цена на км',
      breakEven:'Изравняване', beNotNeeded:'Не е нужно',
      beSub:'{name} струва {amount} повече при покупка и ги връща чрез по-ниски текущи разходи.',
      beBeyond:'Това е след периода от {n} {years}, така че допълнителните {amount} за {name} не се връщат навреме.',
      beDominant:'{name} е по-евтино и за покупка, и за ползване, така че няма какво да се изплаща.',
      beEqual:'Еднаква покупна цена и еднакъв месечен разход.',
      chartTitle:'Натрупана нетна стойност', chartAria:'Натрупана нетна стойност на двете превозни средства във времето',
      start:'Старт', yearN:'Год. {n}', yShort:'г.', moShort:'мес.', afterSale:'след препродажба',
      diffAhead:'Разлика: {amount}, {name} води', breakEvenTag:'Изравняване {when}',
      breakdown:'Разбивка на разходите', colDiff:'Разлика', betterFor:'По-добре за {name}',
      energyPerKm:'Енергия на км', energyMonth:'Енергия на месец',
      energyTotal:'Енергия', fixedTotal:'Фиксирани разходи', netPurchase:'Нетна покупна цена', resaleRow:'Остатъчна стойност', totalNet:'Обща нетна стойност'
    }
  };

  let lang = 'en';
  const t = k => (T[lang][k] !== undefined ? T[lang][k] : (T.en[k] !== undefined ? T.en[k] : k));
  const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (o[k] !== undefined ? o[k] : m));
  const yearsWord = n => lang === 'bg' ? (n === 1 ? 'година' : 'години') : (n === 1 ? 'year' : 'years');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ============ СЪСТОЯНИЕ / STATE ============
  const FUELS = ['diesel','petrol','dieseladblue','hybrid','lpg','cng','electric'];
  const PRICE_KEYS = ['dieselPrice','petrolPrice','lpgPrice','cngPrice','adbluePrice','elPrice'];
  const PRICE_UNIT = {dieselPrice:'uL', petrolPrice:'uL', lpgPrice:'uL', cngPrice:'uKg', adbluePrice:'uL', elPrice:'uKwh'};
  // [min, max] на плъзгача; полето приема и стойности извън диапазона
  // Slider [min, max]; the number box also accepts values outside this range
  const PRICE_RANGE = {dieselPrice:[0.5,3.5], petrolPrice:[0.5,3.5], lpgPrice:[0.3,2], cngPrice:[0.5,3], adbluePrice:[0.5,3], elPrice:[0.05,1.5]};

  const DEFAULTS = {
    v1: { name:'', type:'ice', fuel:'petrol', hybridBaseFuel:'petrol', purchase:60000, subsidy:0, consumption:8, secondaryConsumption:0,
          maintPerYear:1000, insurance:1800, roadTax:49.6, vehicleTax:150, chargerInstall:0, residualPct:30 },
    v2: { name:'', type:'ev', fuel:'electric', hybridBaseFuel:'petrol', purchase:70000, subsidy:0, consumption:22, secondaryConsumption:0,
          maintPerYear:500, insurance:2100, roadTax:49.6, vehicleTax:0, chargerInstall:0, residualPct:20 },
    km: 2500,
    years: 5,
    dieselPrice: 1.50,
    petrolPrice: 1.50,
    lpgPrice: 0.80,
    cngPrice: 1.20,
    adbluePrice: 1.00,
    elPrice: 0.40
  };
  const clone = o => JSON.parse(JSON.stringify(o));
  let state = clone(DEFAULTS);

  // ============ ФОРМАТИРАНЕ / FORMATTING ============
  const locale = () => lang === 'bg' ? 'de-DE' : 'en-GB';
  const nf = (n, d) => n.toLocaleString(locale(), {minimumFractionDigits:d, maximumFractionDigits:d});
  const eur0 = n => nf(Math.round(n), 0) + ' €';
  const eur2 = n => nf(n, 2) + ' €';
  const ct = n => nf(n * 100, 2) + ' €ct';
  const fmtKm = n => nf(Math.round(n), 0) + ' ' + t('uKm');
  const plainNum = n => nf(n, (Math.round(n) === n) ? 0 : (Math.round(n * 10) === n * 10 ? 1 : 2));
  const fmtDuration = months => {
    const y = Math.floor(months / 12);
    let m = Math.round(months % 12);
    let yy = y;
    if (m === 12) { yy += 1; m = 0; }
    const parts = [];
    if (yy > 0) parts.push(yy + ' ' + t('yShort'));
    if (m > 0 || yy === 0) parts.push(m + ' ' + t('moShort'));
    return parts.join(' ');
  };

  // ============ ГОРИВА / FUEL HELPERS ============
  const hasSecondary = v => v.fuel === 'lpg' || v.fuel === 'hybrid' || v.fuel === 'dieseladblue';
  const hasCharger = v => v.fuel === 'electric' || v.fuel === 'hybrid';

  function priceKeysFor(v) {
    switch (v.fuel) {
      case 'electric': return ['elPrice'];
      case 'cng': return ['cngPrice'];
      case 'lpg': return ['lpgPrice', 'petrolPrice'];
      case 'hybrid': return [v.hybridBaseFuel === 'diesel' ? 'dieselPrice' : 'petrolPrice', 'elPrice'];
      case 'dieseladblue': return ['dieselPrice', 'adbluePrice'];
      case 'diesel': return ['dieselPrice'];
      default: return ['petrolPrice'];
    }
  }

  // Разход за енергия в €/км
  // Energy cost in €/km
  function energyPerKm(v) {
    const s = state;
    switch (v.fuel) {
      case 'electric': return v.consumption / 100 * s.elPrice;
      case 'cng': return v.consumption / 100 * s.cngPrice;
      // LPG л/100км × цена LPG + бензин л/100км × цена бензин
      case 'lpg': return v.consumption / 100 * s.lpgPrice + v.secondaryConsumption / 100 * s.petrolPrice;
      // Хибрид: основното гориво вече ползва собствената си цена
      // Hybrid: the base fuel now uses its own price
      case 'hybrid': return v.consumption / 100 * (v.hybridBaseFuel === 'diesel' ? s.dieselPrice : s.petrolPrice)
                            + v.secondaryConsumption / 100 * s.elPrice;
      // AdBlue е на 1000 км / AdBlue is per 1000 km
      case 'dieseladblue': return v.consumption / 100 * s.dieselPrice + v.secondaryConsumption / 1000 * s.adbluePrice;
      case 'diesel': return v.consumption / 100 * s.dieselPrice;
      default: return v.consumption / 100 * s.petrolPrice;
    }
  }

  const consUnit = v => v.fuel === 'electric' ? t('uKwh100') : (v.fuel === 'cng' ? t('uKg100') : t('uL100'));
  const secUnit = v => v.fuel === 'hybrid' ? t('uKwh100') : (v.fuel === 'dieseladblue' ? t('uL1000') : t('uL100'));
  const consCaption = v => {
    if (v.fuel === 'lpg') return 'LPG';
    if (v.fuel === 'hybrid') return v.hybridBaseFuel === 'diesel' ? t('capDiesel') : t('capPetrol');
    return '';
  };
  const secCaption = v => v.fuel === 'lpg' ? t('capPetrol') : (v.fuel === 'hybrid' ? t('capElectricity') : (v.fuel === 'dieseladblue' ? 'AdBlue' : ''));

  function setFuel(k, fuel) {
    const v = state[k];
    if (v.fuel === fuel) return;
    const wasEV = v.fuel === 'electric';
    v.fuel = fuel;
    v.type = fuel === 'electric' ? 'ev' : 'ice';
    // Разумни стойности по подразбиране при смяна
    // Sensible defaults when switching
    if (fuel === 'electric') { v.consumption = 22; v.secondaryConsumption = 0; }
    else if (fuel === 'lpg') { v.consumption = 12; v.secondaryConsumption = 0.5; }
    else if (fuel === 'hybrid') { v.consumption = 5; v.secondaryConsumption = 8; }
    else if (fuel === 'dieseladblue') { v.consumption = 7; v.secondaryConsumption = 1.5; }
    else if (fuel === 'cng') { v.consumption = 8; v.secondaryConsumption = 0; }
    else { v.consumption = wasEV ? 7 : v.consumption; v.secondaryConsumption = 0; }
  }

  // ============ ИЗЧИСЛЕНИЯ / CALCULATIONS ============
  function vehicleCalc(v) {
    const months = state.years * 12;
    const ePerKm = energyPerKm(v);
    const energyMonth = ePerKm * state.km;
    const fixedYear = v.maintPerYear + v.insurance + v.roadTax + v.vehicleTax;
    const energyTotal = energyMonth * months;
    const fixedTotal = fixedYear * state.years;
    // Зарядното е еднократен разход без остатъчна стойност
    // Charger is a one-off cost with no resale value
    const charger = hasCharger(v) ? (v.chargerInstall || 0) : 0;
    const netPurchase = v.purchase - v.subsidy + charger;
    const resale = v.purchase * v.residualPct / 100;
    const gross = netPurchase + energyTotal + fixedTotal;
    const total = gross - resale;
    const monthly = energyMonth + fixedYear / 12;
    const totalKm = state.km * months;
    const perKm = totalKm > 0 ? total / totalKm : 0;
    return { ePerKm, energyMonth, fixedYear, energyTotal, fixedTotal, charger, netPurchase, resale, gross, total, monthly, perKm };
  }

  function calc() {
    const c1 = vehicleCalc(state.v1);
    const c2 = vehicleCalc(state.v2);
    const months = state.years * 12;

    const buyDelta = c1.netPurchase - c2.netPurchase; // > 0: v1 е по-скъпо за покупка
    const runDelta = c2.monthly - c1.monthly;         // > 0: v1 е по-евтино за ползване
    let be = null, dearer = null, dominant = null;
    const eps = 0.005;
    if (buyDelta > eps && runDelta > eps) { be = buyDelta / runDelta; dearer = 'v1'; }
    else if (buyDelta < -eps && runDelta < -eps) { be = buyDelta / runDelta; dearer = 'v2'; }
    else if (Math.abs(buyDelta) > eps || Math.abs(runDelta) > eps) {
      dominant = (buyDelta >= -eps && runDelta <= eps) ? 'v2' : 'v1';
    }

    const diff = c2.total - c1.total;
    const winner = Math.abs(diff) < 0.5 ? null : (diff > 0 ? 'v1' : 'v2');
    return { c1, c2, months, buyDelta, runDelta, be, dearer, dominant, winner, diffAbs: Math.abs(diff) };
  }

  // ============ DOM ============
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const colorVar = k => k === 'v1' ? 'var(--a)' : 'var(--b)';
  const other = k => k === 'v1' ? 'v2' : 'v1';

  // ============ СТАТИЧНИ ТЕКСТОВЕ / STATIC TEXT ============
  function renderStatic() {
    root.lang = lang;
    document.title = t('title');
    $('title').textContent = t('title');
    $('subtitle').textContent = t('subtitle');
    $('hVehicles').textContent = t('vehicles');
    $('hUsage').textContent = t('usage');
    $('hUsageNote').textContent = t('usageNote');
    $('chartTitle').textContent = t('chartTitle');
    $('hBreakdown').textContent = t('breakdown');
    $('resetLbl').textContent = t('reset');
    if (!$('shareBtn').classList.contains('done')) $('shareLbl').textContent = t('copyLink');
    $('costChart').setAttribute('aria-label', t('chartAria'));
    $('themeSeg').setAttribute('aria-label', t('themeAria'));
    const themeNames = {auto:'themeAuto', light:'themeLight', dark:'themeDark'};
    document.querySelectorAll('#themeSeg button').forEach(b => {
      const name = t(themeNames[b.dataset.themeOpt]);
      b.querySelector('.sr').textContent = name;
      b.title = name;
    });
    document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
    $('legend').innerHTML = `
      <li><span class="key"></span>${esc(t('segPurchase'))}</li>
      <li><span class="key e"></span>${esc(t('segEnergy'))}</li>
      <li><span class="key f"></span>${esc(t('segFixed'))}</li>
      <li><span class="key r"></span>${esc(t('segResale'))}</li>`;
  }

  // ============ СПЕЦИФИКАЦИЯ / SPEC SHEET ============
  function renderSheet() {
    const V = ['v1', 'v2'];
    const anyHybrid = V.some(k => state[k].fuel === 'hybrid');
    const anySec = V.some(k => hasSecondary(state[k]));
    const anyCharger = V.some(k => hasCharger(state[k]));
    let h = '';

    // Заглавен ред с имена / header row with names
    h += `<div class="cell corner" aria-hidden="true"></div>`;
    V.forEach(k => {
      h += `<div class="cell vh ${k}" style="--c:${colorVar(k)}">
        <input class="name" type="text" maxlength="60" data-veh="${k}" data-field="name"
               value="${esc(state[k].name)}" aria-label="${esc(t('nameAria'))}">
      </div>`;
    });

    const grp = label => `<div class="grp">${esc(label)}</div>`;
    const row = (label, cellFn) => {
      let r = `<div class="cell lbl">${esc(label)}</div>`;
      V.forEach(k => { r += cellFn(k, label); });
      return r;
    };
    const na = k => `<div class="cell na ${k}" aria-hidden="true">—</div>`;
    const num = (field, unit, step, opts = {}) => (k, label) => {
      const v = state[k];
      const max = opts.max !== undefined ? ` max="${opts.max}"` : '';
      const cap = opts.cap ? opts.cap(v) : '';
      return `<div class="cell v ${k}">
        <label class="num"><input type="number" inputmode="decimal" min="0"${max} step="${step}"
          data-veh="${k}" data-field="${field}" value="${v[field]}"
          aria-label="${esc(label + ' – ' + v.name)}"><span class="u">${esc(typeof unit === 'function' ? unit(v) : unit)}</span></label>
        ${cap ? `<span class="cap">${esc(cap)}</span>` : ''}
      </div>`;
    };

    // Тип гориво / fuel type
    h += row(t('fuelType'), (k, label) => `<div class="cell v ${k}"><div class="sel-wrap">
      <select class="sel" data-fuelsel="${k}" aria-label="${esc(label + ' – ' + state[k].name)}">
        ${FUELS.map(f => `<option value="${f}"${state[k].fuel === f ? ' selected' : ''}>${esc(t(f))}</option>`).join('')}
      </select></div></div>`);

    if (anyHybrid) {
      h += row(t('hybridBase'), (k, label) => state[k].fuel !== 'hybrid' ? na(k) : `<div class="cell v ${k}">
        <div class="seg sm" role="group" aria-label="${esc(label + ' – ' + state[k].name)}">
          ${['petrol', 'diesel'].map(f => `<button type="button" data-veh="${k}" data-hybridbase="${f}" aria-pressed="${state[k].hybridBaseFuel === f}">${esc(t(f))}</button>`).join('')}
        </div></div>`);
    }

    h += grp(t('grpPurchase'));
    h += row(t('purchase'), num('purchase', t('uEur'), 500));
    h += row(t('subsidy'), num('subsidy', t('uEur'), 500));
    if (anyCharger) {
      h += row(t('charger'), (k, label) => hasCharger(state[k]) ? num('chargerInstall', t('uEur'), 100)(k, label) : na(k));
    }
    h += row(t('residual'), num('residualPct', t('uPct'), 1, {max: 100}));

    h += grp(t('grpEnergy'));
    h += row(t('consumption'), num('consumption', consUnit, 0.1, {cap: consCaption}));
    if (anySec) {
      h += row(t('secondary'), (k, label) => hasSecondary(state[k]) ? num('secondaryConsumption', secUnit, 0.1, {cap: secCaption})(k, label) : na(k));
    }

    h += grp(t('grpFixed'));
    h += row(t('maint'), num('maintPerYear', t('uEurYr'), 50));
    h += row(t('insurance'), num('insurance', t('uEurYr'), 50));
    h += row(t('roadTax'), num('roadTax', t('uEurYr'), 10));
    h += row(t('vehicleTax'), num('vehicleTax', t('uEurYr'), 10));

    $('sheet').innerHTML = h;
  }

  // ============ ПРОБЕГ И ЦЕНИ / USAGE AND PRICES ============
  function usedPriceKeys() {
    const used = new Set([...priceKeysFor(state.v1), ...priceKeysFor(state.v2)]);
    return PRICE_KEYS.filter(k => used.has(k));
  }

  function renderUsage() {
    const ctl = (key, label, min, max, rStep, nStep, unit) => `
      <div class="ctl">
        <label class="ctl-l" for="g-${key}">${esc(label)}</label>
        <input class="rng" type="range" min="${min}" max="${max}" step="${rStep}" value="${state[key]}"
               data-global="${key}" aria-label="${esc(label)}">
        <label class="num"><input type="number" inputmode="decimal" id="g-${key}" min="0" step="${nStep}"
               value="${PRICE_KEYS.includes(key) ? state[key].toFixed(2) : state[key]}" data-global="${key}"><span class="u">${esc(unit)}</span></label>
      </div>`;
    let h = '';
    h += ctl('km', t('kmMonth'), 500, 30000, 100, 100, t('uKm'));
    h += ctl('years', t('years'), 1, 15, 1, 1, t('uYrs'));
    usedPriceKeys().forEach(k => {
      const [mn, mx] = PRICE_RANGE[k];
      h += ctl(k, t(k), mn, mx, 0.01, 0.01, t(PRICE_UNIT[k]));
    });
    $('usage').innerHTML = h;
    document.querySelectorAll('#usage .rng').forEach(setFill);
  }

  function setFill(r) {
    const mn = parseFloat(r.min), mx = parseFloat(r.max);
    const v = Math.min(mx, Math.max(mn, parseFloat(r.value)));
    r.style.setProperty('--p', ((v - mn) / (mx - mn) * 100) + '%');
  }

  // ============ РЕЗУЛТАТИ / RESULTS ============
  function renderVerdict(d) {
    const n = state.years, years = yearsWord(n);
    const text = d.winner
      ? fmt(t('verdictWin'), {name: state[d.winner].name, amount: eur0(d.diffAbs), n, years})
      : fmt(t('verdictEqual'), {n, years});
    $('verdictText').textContent = text;
    $('verdictSub').textContent = fmt(t('verdictSub'), {km: fmtKm(state.km)});
    const win = d.winner ? colorVar(d.winner) : 'var(--ink)';
    $('verdict').style.setProperty('--win', win);
    const mb = $('mbar');
    mb.textContent = text;
    mb.style.setProperty('--win', win);
  }

  function renderBars(d) {
    const max = Math.max(d.c1.gross, d.c2.gross, 1);
    const pct = x => Math.max(0, x / max * 100);
    const bar = (k, c) => {
      const p = pct(Math.max(0, c.netPurchase));
      const e = pct(c.energyTotal);
      const f = pct(c.fixedTotal);
      const totalPos = pct(Math.max(0, c.total));
      const gross = p + e + f;
      return `<div class="bar-row" style="--c:${colorVar(k)}">
        <div class="bar-head">
          <span class="bar-name"><span class="dot"></span><span>${esc(state[k].name)}</span></span>
          <span class="bar-total">${eur0(c.total)}</span>
        </div>
        <div class="bar-track">
          <span class="s-p" style="width:${p}%" title="${esc(t('segPurchase') + ': ' + eur0(c.netPurchase))}"></span>
          <span class="s-e" style="width:${e}%" title="${esc(t('segEnergy') + ': ' + eur0(c.energyTotal))}"></span>
          <span class="s-f" style="width:${f}%" title="${esc(t('segFixed') + ': ' + eur0(c.fixedTotal))}"></span>
          <span class="resale" style="left:${totalPos}%;width:${Math.max(0, gross - totalPos)}%;height:100%" title="${esc(t('segResale') + ': −' + eur0(c.resale))}"></span>
          <span class="tick" style="left:calc(${totalPos}% - 1px);height:100%"></span>
        </div>
      </div>`;
    };
    $('bars').innerHTML = bar('v1', d.c1) + bar('v2', d.c2);
    $('bars').setAttribute('aria-label', fmt(t('barsAria'), {a: state.v1.name, va: eur0(d.c1.total), b: state.v2.name, vb: eur0(d.c2.total)}));
  }

  function renderFigures(d) {
    const head = k => `<span class="h-name" style="--c:${colorVar(k)}"><span class="dot"></span>${esc(state[k].name)}</span>`;
    $('mini').innerHTML = `<table>
      <thead><tr><th><span class="sr">—</span></th><th>${head('v1')}</th><th>${head('v2')}</th></tr></thead>
      <tbody>
        <tr><td>${esc(t('monthlyCost'))}</td><td>${eur2(d.c1.monthly)}</td><td>${eur2(d.c2.monthly)}</td></tr>
        <tr><td>${esc(t('perKm'))}</td><td>${ct(d.c1.perKm)}</td><td>${ct(d.c2.perKm)}</td></tr>
      </tbody></table>`;

    let v, s;
    if (d.be !== null && isFinite(d.be)) {
      v = fmtDuration(d.be);
      const o = {name: state[d.dearer].name, amount: eur0(Math.abs(d.buyDelta)), n: state.years, years: yearsWord(state.years)};
      s = d.be > d.months ? fmt(t('beBeyond'), o) : fmt(t('beSub'), o);
    } else if (d.dominant) {
      v = t('beNotNeeded');
      s = fmt(t('beDominant'), {name: state[d.dominant].name});
    } else {
      v = t('beNotNeeded');
      s = t('beEqual');
    }
    $('be').innerHTML = `<p class="k">${esc(t('breakEven'))}</p><p class="v">${esc(v)}</p><p class="s">${esc(s)}</p>`;
  }

  function renderBreakdown(d) {
    const v1 = state.v1, v2 = state.v2, c1 = d.c1, c2 = d.c2;
    const head = k => `<span class="h-name" style="--c:${colorVar(k)}"><span class="dot"></span>${esc(state[k].name)}</span>`;
    // diff: lowerIsBetter = true за разходи, false за остатъчна стойност
    const diffCell = (a, b, f, lowerIsBetter = true) => {
      if (Math.abs(a - b) < 0.005) return `<td class="muted">—</td>`;
      const better = lowerIsBetter ? (a < b ? 'v1' : 'v2') : (a > b ? 'v1' : 'v2');
      const label = fmt(t('betterFor'), {name: state[better].name});
      return `<td><span class="diff" title="${esc(label)}"><span class="dot" style="--c:${colorVar(better)}"></span>${f(Math.abs(a - b))}<span class="sr">, ${esc(label)}</span></span></td>`;
    };
    const r = (label, a, b, diff, cls = '') => `<tr${cls ? ` class="${cls}"` : ''}><td>${esc(label)}</td><td>${a}</td><td>${b}</td>${diff}</tr>`;
    const g = label => `<tr class="g"><th colspan="4">${esc(label)}</th></tr>`;
    const cons = (v, val, unitFn) => `${plainNum(val)} ${esc(unitFn(v))}`;

    let h = `<thead><tr><th><span class="sr">—</span></th><th>${head('v1')}</th><th>${head('v2')}</th><th>${esc(t('colDiff'))}</th></tr></thead><tbody>`;
    h += g(t('grpEnergy'));
    h += r(t('consumption'), cons(v1, v1.consumption, consUnit), cons(v2, v2.consumption, consUnit), `<td class="muted">—</td>`);
    if (hasSecondary(v1) || hasSecondary(v2)) {
      const sec = v => hasSecondary(v) ? `${plainNum(v.secondaryConsumption)} ${esc(secUnit(v))} <span class="muted">${esc(secCaption(v))}</span>` : `<span class="muted">—</span>`;
      h += r(t('secondary'), sec(v1), sec(v2), `<td class="muted">—</td>`);
    }
    h += r(t('energyPerKm'), ct(c1.ePerKm), ct(c2.ePerKm), diffCell(c1.ePerKm, c2.ePerKm, ct));
    h += r(t('energyMonth'), eur2(c1.energyMonth), eur2(c2.energyMonth), diffCell(c1.energyMonth, c2.energyMonth, eur2));

    h += g(t('grpFixed'));
    h += r(t('maint'), eur2(v1.maintPerYear), eur2(v2.maintPerYear), diffCell(v1.maintPerYear, v2.maintPerYear, eur2));
    h += r(t('insurance'), eur2(v1.insurance), eur2(v2.insurance), diffCell(v1.insurance, v2.insurance, eur2));
    h += r(t('roadTax'), eur2(v1.roadTax), eur2(v2.roadTax), diffCell(v1.roadTax, v2.roadTax, eur2));
    h += r(t('vehicleTax'), eur2(v1.vehicleTax), eur2(v2.vehicleTax), diffCell(v1.vehicleTax, v2.vehicleTax, eur2));

    h += g(fmt(t('grpOver'), {n: state.years, years: yearsWord(state.years)}));
    h += r(t('netPurchase'), eur0(c1.netPurchase), eur0(c2.netPurchase), diffCell(c1.netPurchase, c2.netPurchase, eur0));
    if (c1.charger > 0 || c2.charger > 0) {
      h += r(t('charger'), c1.charger > 0 ? eur0(c1.charger) : '<span class="muted">—</span>', c2.charger > 0 ? eur0(c2.charger) : '<span class="muted">—</span>', `<td class="muted">—</td>`);
    }
    h += r(t('energyTotal'), eur0(c1.energyTotal), eur0(c2.energyTotal), diffCell(c1.energyTotal, c2.energyTotal, eur0));
    h += r(t('fixedTotal'), eur0(c1.fixedTotal), eur0(c2.fixedTotal), diffCell(c1.fixedTotal, c2.fixedTotal, eur0));
    h += r(t('resaleRow'), '−' + eur0(c1.resale), '−' + eur0(c2.resale), diffCell(c1.resale, c2.resale, eur0, false));
    h += r(t('totalNet'), eur0(c1.total), eur0(c2.total), diffCell(c1.total, c2.total, eur0), 'total');
    h += '</tbody>';
    $('tbl').innerHTML = h;
  }

  // ============ ГРАФИКА / CHART ============
  let chart = null;
  const chartState = {be: null, beY: null, months: 60};
  const cssVar = n => getComputedStyle(root).getPropertyValue(n).trim();
  function hexA(hex, a) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }
  const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function series(c, months) {
    const pts = [];
    for (let m = 0; m <= months; m++) pts.push({x: m, y: Math.round(c.netPurchase + c.monthly * m)});
    // Продажба в края: стъпка надолу с остатъчната стойност
    // Sale at the end: step down by the resale value
    pts.push({x: months, y: Math.round(c.netPurchase + c.monthly * months - c.resale)});
    return pts;
  }

  const END_FONT = '600 11px "IBM Plex Sans", system-ui, sans-serif';
  const END_OFFSET = 10;

  const overlayPlugin = {
    id: 'vcOverlay',
    afterDatasetsDraw(c) {
      const {ctx, chartArea, scales} = c;
      if (!chartArea) return;
      const ink = cssVar('--ink'), ink3 = cssVar('--ink-3'), panel = cssVar('--panel');

      // Точка на изравняване / break-even marker
      if (chartState.be !== null && chartState.be > 0 && chartState.be < chartState.months) {
        const x = scales.x.getPixelForValue(chartState.be);
        const y = scales.y.getPixelForValue(chartState.beY);
        ctx.save();
        ctx.strokeStyle = ink3; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = panel; ctx.strokeStyle = ink; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        const label = fmt(t('breakEvenTag'), {when: fmtDuration(chartState.be)});
        ctx.font = '600 11px "IBM Plex Sans", system-ui, sans-serif';
        const w = ctx.measureText(label).width + 14;
        let lx = x + 8;
        if (lx + w > chartArea.right) lx = x - w - 8;
        const ly = chartArea.top + 4;
        ctx.fillStyle = ink;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(lx, ly, w, 20, 4); else ctx.rect(lx, ly, w, 20);
        ctx.fill();
        ctx.fillStyle = panel; ctx.textBaseline = 'middle';
        ctx.fillText(label, lx + 7, ly + 10.5);
        ctx.restore();
      }

      // Крайни точки след препродажбата: точка + етикет с крайната стойност
      // End points after resale: dot + label with the final value
      const ends = [];
      c.data.datasets.forEach((ds, i) => {
        const meta = c.getDatasetMeta(i);
        if (!meta || meta.hidden || !meta.data.length || !ds.data.length) return;
        const pt = meta.data[meta.data.length - 1];
        ends.push({x: pt.x, y: pt.y, ly: pt.y, color: ds.borderColor, val: ds.data[ds.data.length - 1].y});
      });
      if (ends.length === 2) {
        const [hi, lo] = ends[0].y <= ends[1].y ? [ends[0], ends[1]] : [ends[1], ends[0]];
        const gap = 22;
        if (lo.ly - hi.ly < gap) {
          const mid = (hi.y + lo.y) / 2;
          hi.ly = mid - gap / 2;
          lo.ly = mid + gap / 2;
        }
      }
      ctx.save();
      ctx.font = END_FONT;
      ctx.textBaseline = 'middle';
      ends.forEach(e => {
        e.ly = Math.max(chartArea.top + 10, Math.min(chartArea.bottom - 10, e.ly));
        const label = eur0(e.val);
        const w = ctx.measureText(label).width + 12;
        const lx = e.x + END_OFFSET;
        // Свързваща линия / connector
        ctx.strokeStyle = e.color; ctx.lineWidth = 1.5; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(e.x, e.y);
        if (Math.abs(e.ly - e.y) > 1) ctx.lineTo(lx - 4, e.ly);
        ctx.lineTo(lx, e.ly); ctx.stroke();
        // Точка / dot
        ctx.fillStyle = e.color; ctx.strokeStyle = panel; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // Етикет / label pill
        ctx.fillStyle = e.color;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(lx, e.ly - 10, w, 20, 4); else ctx.rect(lx, e.ly - 10, w, 20);
        ctx.fill();
        ctx.fillStyle = panel;
        ctx.fillText(label, lx + 6, e.ly + 0.5);
      });
      ctx.restore();

      // Курсор / crosshair
      const act = c.tooltip && c.tooltip.getActiveElements && c.tooltip.getActiveElements();
      if (act && act.length) {
        const x = act[0].element.x;
        ctx.save();
        ctx.strokeStyle = ink3; ctx.globalAlpha = .5; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke();
        ctx.restore();
      }
    }
  };

  function tooltipTitle(items) {
    if (!items.length) return '';
    const idx = items[0].dataIndex;
    const m = items[0].parsed.x;
    let s;
    if (m === 0) s = t('start');
    else s = fmtDuration(m);
    if (idx === chartState.months + 1) s += ', ' + t('afterSale');
    return s;
  }

  // Последният сегмент (спадът от препродажбата) е пунктиран
  // The last segment (the resale drop) is dashed
  const resaleDash = ctx => (ctx.p1DataIndex === chartState.months + 1 ? [4, 3] : undefined);

  function initChart() {
    if (typeof Chart === 'undefined') { $('chartBlock').style.display = 'none'; return; }
    Chart.defaults.font.family = '"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif';
    chart = new Chart($('costChart'), {
      type: 'line',
      data: { datasets: [
        { label: '', data: [], borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 5, pointHoverBorderWidth: 2, tension: 0, fill: false,
          segment: { borderDash: resaleDash } },
        { label: '', data: [], borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 5, pointHoverBorderWidth: 2, tension: 0,
          segment: { borderDash: resaleDash },
          fill: { target: 0, above: 'transparent', below: 'transparent' } }
      ]},
      options: {
        responsive: true,
        maintainAspectRatio: false,
        parsing: false,
        interaction: { mode: 'index', intersect: false },
        animation: reducedMotion() ? false : { duration: 300 },
        layout: { padding: { right: 90, top: 4 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            padding: 10, cornerRadius: 6, boxWidth: 8, boxHeight: 8, boxPadding: 4, usePointStyle: true,
            titleFont: { weight: '600' },
            callbacks: {
              title: tooltipTitle,
              label: c => ' ' + c.dataset.label + ': ' + eur0(c.parsed.y),
              afterBody: items => {
                if (items.length < 2) return '';
                const a = items[0].parsed.y, b = items[1].parsed.y;
                if (Math.abs(a - b) < 1) return '';
                const leader = a < b ? items[0].dataset.label : items[1].dataset.label;
                return ['', fmt(t('diffAhead'), {amount: eur0(Math.abs(a - b)), name: leader})];
              }
            }
          }
        },
        scales: {
          x: {
            type: 'linear', min: 0, max: 60,
            ticks: {
              stepSize: 12, maxRotation: 0, autoSkip: true, font: { size: 11 },
              callback: v => v === 0 ? t('start') : (v % 12 === 0 ? fmt(t('yearN'), {n: v / 12}) : '')
            },
            grid: { display: false }
          },
          y: {
            ticks: { font: { size: 11 }, callback: v => nf(v / 1000, 0) + 'k €' },
            grid: { drawTicks: false },
            border: { display: false }
          }
        }
      },
      plugins: [overlayPlugin]
    });
    applyChartTheme();
  }

  function applyChartTheme() {
    if (!chart) return;
    const a = cssVar('--a'), b = cssVar('--b'), ink = cssVar('--ink'), ink2 = cssVar('--ink-2'),
          line = cssVar('--line'), panel = cssVar('--panel');
    const [d1, d2] = chart.data.datasets;
    d1.borderColor = a; d1.pointHoverBackgroundColor = a; d1.pointHoverBorderColor = panel;
    d2.borderColor = b; d2.pointHoverBackgroundColor = b; d2.pointHoverBorderColor = panel;
    // Зоната между линиите се оцветява в цвета на по-евтиното
    // The area between lines is tinted with the cheaper vehicle's colour
    d2.fill = { target: 0, above: hexA(a, .12), below: hexA(b, .12) };
    const o = chart.options;
    o.scales.x.ticks.color = ink2;
    o.scales.y.ticks.color = ink2;
    o.scales.y.grid.color = line;
    o.scales.x.border = { color: line };
    o.plugins.tooltip.backgroundColor = ink;
    o.plugins.tooltip.titleColor = panel;
    o.plugins.tooltip.bodyColor = panel;
    o.plugins.tooltip.footerColor = panel;
    chart.update('none');
  }

  function updateChart(d, animate) {
    if (!chart) return;
    const months = d.months;
    chartState.months = months;
    chartState.be = (d.be !== null && isFinite(d.be)) ? d.be : null;
    chartState.beY = chartState.be !== null ? d.c1.netPurchase + d.c1.monthly * chartState.be : null;
    chart.data.datasets[0].data = series(d.c1, months);
    chart.data.datasets[1].data = series(d.c2, months);
    chart.data.datasets[0].label = state.v1.name;
    chart.data.datasets[1].label = state.v2.name;
    chart.options.scales.x.max = months;
    // Място вдясно за етикетите на крайните стойности
    // Room on the right for the end-value labels
    const cx = chart.ctx;
    cx.save(); cx.font = END_FONT;
    const maxW = Math.max(cx.measureText(eur0(d.c1.total)).width, cx.measureText(eur0(d.c2.total)).width);
    cx.restore();
    chart.options.layout.padding.right = Math.ceil(maxW + 12 + END_OFFSET + 6);
    chart.update(animate && !reducedMotion() ? undefined : 'none');
  }

  // ============ РЕНДЕРИРАНЕ / RENDER ============
  function renderResults(animate) {
    const d = calc();
    renderVerdict(d);
    renderBars(d);
    renderFigures(d);
    renderBreakdown(d);
    updateChart(d, animate);
    scheduleUrlUpdate();
  }

  function renderAll() {
    renderStatic();
    renderSheet();
    renderUsage();
    renderResults(true);
  }

  // ============ ВЪВЕЖДАНЕ / INPUT HANDLERS (delegated) ============
  $('sheet').addEventListener('input', e => {
    const el = e.target;
    const k = el.dataset.veh, field = el.dataset.field;
    if (!k || !field) return;
    if (field === 'name') {
      state[k].name = el.value;
    } else {
      const val = parseFloat(el.value);
      if (isNaN(val)) return;
      state[k][field] = field === 'residualPct' ? Math.min(100, Math.max(0, val)) : val;
    }
    renderResults(false);
  });
  // Ако името е изтрито, връщаме името по подразбиране при излизане от полето
  // Restore the default name if the field is left empty
  $('sheet').addEventListener('focusout', e => {
    const el = e.target;
    if (el.dataset.field === 'name' && !el.value.trim()) {
      const k = el.dataset.veh;
      state[k].name = t(k + 'Default');
      el.value = state[k].name;
      renderResults(false);
    }
  });
  $('sheet').addEventListener('change', e => {
    const k = e.target.dataset.fuelsel;
    if (!k) return;
    setFuel(k, e.target.value);
    renderSheet();
    renderUsage();
    renderResults(true);
    const sel = document.querySelector(`[data-fuelsel="${k}"]`);
    if (sel) sel.focus();
  });
  $('sheet').addEventListener('click', e => {
    const btn = e.target.closest('[data-hybridbase]');
    if (!btn) return;
    const k = btn.dataset.veh;
    state[k].hybridBaseFuel = btn.dataset.hybridbase;
    renderSheet();
    renderUsage();
    renderResults(true);
    const again = document.querySelector(`[data-veh="${k}"][data-hybridbase="${btn.dataset.hybridbase}"]`);
    if (again) again.focus();
  });

  $('usage').addEventListener('input', e => {
    const el = e.target;
    const key = el.dataset.global;
    if (!key) return;
    let val = parseFloat(el.value);
    if (isNaN(val)) return;
    if (key === 'years') val = Math.max(1, Math.min(30, Math.round(val)));
    if (val < 0) val = 0;
    state[key] = val;
    const row = el.closest('.ctl');
    const rng = row.querySelector('.rng');
    const box = row.querySelector('input[type="number"]');
    if (el === rng) box.value = val;
    else rng.value = val;
    setFill(rng);
    renderResults(false);
  });

  // ============ URL СПОДЕЛЯНЕ / URL SHARING ============
  const URL_KEYS = {
    name:'n', type:'t', fuel:'f', hybridBaseFuel:'hb',
    purchase:'p', subsidy:'s', consumption:'c', secondaryConsumption:'sc',
    maintPerYear:'m', insurance:'i', roadTax:'rt', vehicleTax:'vt', chargerInstall:'ci', residualPct:'r',
    km:'km', dieselPrice:'dp', petrolPrice:'pp', lpgPrice:'lp', cngPrice:'cp', adbluePrice:'ap', elPrice:'ep', years:'y',
    lang:'l'
  };
  const GLOBAL_KEYS = ['km','dieselPrice','petrolPrice','lpgPrice','cngPrice','adbluePrice','elPrice','years'];
  const NUM_FIELDS = new Set(['purchase','subsidy','consumption','secondaryConsumption','maintPerYear','insurance','roadTax','vehicleTax','chargerInstall','residualPct']);

  function encodeStateToUrl() {
    const p = new URLSearchParams();
    const writeVeh = (prefix, v) => Object.keys(v).forEach(k => {
      const short = URL_KEYS[k];
      if (!short || v[k] === '' || v[k] === null || v[k] === undefined) return;
      p.set(prefix + short, String(v[k]));
    });
    writeVeh('1', state.v1);
    writeVeh('2', state.v2);
    GLOBAL_KEYS.forEach(k => p.set(URL_KEYS[k], String(state[k])));
    p.set(URL_KEYS.lang, lang);
    try { history.replaceState(null, '', location.pathname + '?' + p.toString() + location.hash); } catch (_) {}
  }

  function decodeStateFromUrl() {
    let p;
    try { p = new URLSearchParams(location.search); } catch (_) { return; }
    if (![...p.keys()].length) return;
    const readVeh = (prefix, v) => Object.keys(URL_KEYS).forEach(k => {
      if (!(k in v)) return;
      const raw = p.get(prefix + URL_KEYS[k]);
      if (raw === null) return;
      if (NUM_FIELDS.has(k)) { const n = parseFloat(raw); if (!isNaN(n)) v[k] = n; }
      else v[k] = raw;
    });
    readVeh('1', state.v1);
    readVeh('2', state.v2);
    ['v1', 'v2'].forEach(k => {
      const v = state[k];
      if (v.type === 'ev') v.fuel = 'electric';
      if (!FUELS.includes(v.fuel)) v.fuel = DEFAULTS[k].fuel;
      v.type = v.fuel === 'electric' ? 'ev' : 'ice';
      if (v.hybridBaseFuel !== 'diesel') v.hybridBaseFuel = 'petrol';
    });
    GLOBAL_KEYS.forEach(k => {
      const raw = p.get(URL_KEYS[k]);
      if (raw === null) return;
      const n = parseFloat(raw);
      if (!isNaN(n)) state[k] = n;
    });
    // Съвместимост със стари линкове: една обща цена "fp" за дизел и бензин
    // Backward compatibility: old links had a single "fp" price for diesel and petrol
    const oldFp = parseFloat(p.get('fp'));
    if (!isNaN(oldFp)) {
      if (p.get('dp') === null) state.dieselPrice = oldFp;
      if (p.get('pp') === null) state.petrolPrice = oldFp;
    }
    state.years = Math.max(1, Math.min(30, Math.round(state.years)));
    const l = p.get('l');
    if (l === 'bg' || l === 'en') lang = l;
  }

  let urlTimer = null;
  function scheduleUrlUpdate() {
    clearTimeout(urlTimer);
    urlTimer = setTimeout(encodeStateToUrl, 250);
  }

  // ============ БУТОНИ / HEADER CONTROLS ============
  $('shareBtn').addEventListener('click', async () => {
    clearTimeout(urlTimer);
    encodeStateToUrl();
    const url = location.href;
    const btn = $('shareBtn');
    const done = () => {
      btn.classList.add('done');
      $('shareLbl').textContent = t('copied');
      setTimeout(() => { btn.classList.remove('done'); $('shareLbl').textContent = t('copyLink'); }, 1800);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(url);
      } else {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      done();
    } catch (_) {
      window.prompt(t('copyPrompt'), url);
    }
  });

  $('resetBtn').addEventListener('click', () => {
    state = clone(DEFAULTS);
    state.v1.name = t('v1Default');
    state.v2.name = t('v2Default');
    renderAll();
  });

  $('langSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    ['v1', 'v2'].forEach(k => {
      if (state[k].name === T.bg[k + 'Default'] || state[k].name === T.en[k + 'Default']) state[k].name = t(k + 'Default');
    });
    renderAll();
  });

  // ============ ТЕМА / THEME ============
  let themePref = 'auto';
  try { const s = localStorage.getItem('vc-theme'); if (s === 'light' || s === 'dark') themePref = s; } catch (_) {}
  function applyTheme() {
    if (themePref === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', themePref);
    document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeOpt === themePref ? 'true' : 'false'));
    applyChartTheme();
  }
  $('themeSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-theme-opt]');
    if (!b) return;
    themePref = b.dataset.themeOpt;
    try { if (themePref === 'auto') localStorage.removeItem('vc-theme'); else localStorage.setItem('vc-theme', themePref); } catch (_) {}
    applyTheme();
  });
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (themePref === 'auto') applyChartTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
  }

  // ============ МОБИЛНА ЛЕНТА / MOBILE VERDICT BAR ============
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => $('mbar').classList.toggle('show', !en.isIntersecting));
    });
    io.observe($('verdict'));
  }

  // ============ ИНИЦИАЛИЗАЦИЯ / INIT ============
  decodeStateFromUrl();
  if (!state.v1.name) state.v1.name = t('v1Default');
  if (!state.v2.name) state.v2.name = t('v2Default');
  initChart();
  applyTheme();
  renderAll();
})();
</script>
</body>
</html>
