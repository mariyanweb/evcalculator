    en: {

  };

  let lang = 'en';
  const t = (k) => T[lang][k];

  // ============ СЪСТОЯНИЕ / STATE ============
  // Стойности по подразбиране копират примера (електрически камион vs дизелов)
  // Default values mirror the original (electric truck vs diesel)
  // Модел на консумация:
  //  - EV: consumption е kWh/100км; secondaryConsumption не се ползва
  //  - ICE (дизел/бензин/CNG): consumption е л/100км (или кг/100км за CNG); secondary не се ползва
  //  - LPG: consumption = LPG л/100км; secondaryConsumption = бензин л/100км (пилотна доза/превключване)
  //  - Хибрид: consumption = бензин/дизел л/100км; secondaryConsumption = ток kWh/100км
  // hybridBaseFuel определя кое е "основното" гориво при хибрид: 'petrol' или 'diesel'
  const state = {
    v1: {
	  name: '',
      type: 'ice',
      fuel: 'petrol',
      hybridBaseFuel: 'petrol',
      purchase: 60000,
      subsidy: 0,
      consumption: 8,
      secondaryConsumption: 0,
      maintPerYear: 1000,
      insurance: 1800,
      roadTax: 49.6,
      residualPct: 30
    },
    v2: {
      name: '',
      type: 'ev',
      fuel: 'electric',
      hybridBaseFuel: 'petrol',
      purchase: 70000,
      subsidy: 0,
      consumption: 22,
      secondaryConsumption: 0,
      maintPerYear: 500,
      insurance: 2100,
      roadTax: 49.6,
      residualPct: 20
    },
    km: 2500,
    fuelPrice: 1.50,            // основна цена (дизел или бензин — според горивото на ПС)
    lpgPrice: 0.80,             // €/л LPG
    cngPrice: 1.20,              // €/кг CNG
    elPrice: 0.40,              // €/kWh
    years: 5
  };

  // ============ ФОРМАТИРАНЕ / FORMATTING ============
  const locale = () => lang === 'bg' ? 'de-DE' : 'en-GB';
  const eur = (n) => n.toLocaleString(locale(), {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
  const ct = (n) => (n*100).toFixed(2) + ' €ct';
  const fmtKm = (n) => parseInt(n).toLocaleString(locale()) + ' ' + t('kmUnit');
  const fmtPct = (n) => n.toFixed(0) + '%';

  // ============ ИЗЧИСЛЕНИЯ / CALCULATIONS ============
  // Връща структура: {primary, secondary, total} в €/км
  function fuelCostPerKm(v) {
    if (v.type === 'ev') {
      // kWh/100км × €/kWh
      const total = (v.consumption / 100) * state.elPrice;
      return { primary: total, secondary: 0, total };
    }
    if (v.fuel === 'cng') {
      const total = (v.consumption / 100) * state.cngPrice;
      return { primary: total, secondary: 0, total };
    }
    if (v.fuel === 'lpg') {
      // LPG л/100км × €/л LPG  +  бензин л/100км × €/л
      const primary = (v.consumption / 100) * state.lpgPrice;
      const secondary = (v.secondaryConsumption / 100) * state.fuelPrice;
      return { primary, secondary, total: primary + secondary };
    }
    if (v.fuel === 'hybrid') {
      // бензин/дизел л/100км × €/л  +  ток kWh/100км × €/kWh
      const primary = (v.consumption / 100) * state.fuelPrice;
      const secondary = (v.secondaryConsumption / 100) * state.elPrice;
      return { primary, secondary, total: primary + secondary };
    }
    // дизел / бензин
    const total = (v.consumption / 100) * state.fuelPrice;
    return { primary: total, secondary: 0, total };
  }

  function calc() {
    const kmYear = state.km * 12;
    const totalKm = kmYear * state.years;

    function vehicleCalc(v) {
      const fuel = fuelCostPerKm(v);
      const fuelKm = fuel.total;
      // Поддръжката вече е годишна фиксирана сума, не зависи от пробега
      const opKm = fuelKm; // оперативен разход на км = само гориво
      const opMonth = fuelKm * state.km;
      const opYearly = fuelKm * kmYear;
      const fixedYearly = v.insurance + v.roadTax + v.maintPerYear;
      const fixedTotal = fixedYearly * state.years;
      const opTotal = fuelKm * totalKm;
      const netPurchase = v.purchase - v.subsidy;
      const residualValue = v.purchase * (v.residualPct / 100);
      const grandTotal = netPurchase + opTotal + fixedTotal - residualValue;
      // Показваме общ месечен разход (гориво + дял от фиксираните) за по-смислено сравнение
      const totalMonthly = opMonth + fixedYearly / 12;
      return { fuel, fuelKm, opKm, opMonth, opYearly, fixedYearly, fixedTotal, opTotal, totalMonthly, netPurchase, residualValue, grandTotal };
    }

    const c1 = vehicleCalc(state.v1);
    const c2 = vehicleCalc(state.v2);

    // Break-even по операционни + фиксирани разходи спрямо разлика в нетна покупка
    const monthlyDelta = (c2.opMonth + c2.fixedYearly/12) - (c1.opMonth + c1.fixedYearly/12);
    const purchaseDelta = c1.netPurchase - c2.netPurchase;
    let beMonths = null;
    let costlier = null; // кой е по-скъп при покупка
    if (purchaseDelta > 0 && monthlyDelta > 0) {
      beMonths = purchaseDelta / monthlyDelta;
      costlier = 'v1';
    } else if (purchaseDelta < 0 && monthlyDelta < 0) {
      beMonths = (-purchaseDelta) / (-monthlyDelta);
      costlier = 'v2';
    }

    return { c1, c2, kmYear, totalKm, monthlyDelta, purchaseDelta, beMonths, costlier };
  }

  // ============ РЕНДЕРИНГ НА КАРТИЧКИ / VEHICLE CARDS ============
  function fuelTypeButtons(which) {
    const v = state[which];
    const types = [
      {id:'diesel', cat:'ice'},
      {id:'petrol', cat:'ice'},
      {id:'cng', cat:'ice'},
      {id:'lpg', cat:'ice'},
      {id:'hybrid', cat:'ice'},
      {id:'electric', cat:'ev'}
    ];
    return types.map(ft => {
      const active = v.fuel === ft.id ? 'active' : '';
      return `<button data-veh="${which}" data-fuel="${ft.id}" data-cat="${ft.cat}" class="${active}">${t(ft.id)}</button>`;
    }).join('');
  }

  function consumptionLabel(v) {
    if (v.type === 'ev') return t('consEv');
    if (v.fuel === 'cng') return t('consCng');
    if (v.fuel === 'lpg') return t('consLpg');
    if (v.fuel === 'hybrid') return t('consHybridFuel'); // основното гориво на хибрида
    return t('consIce');
  }
  function consumptionUnit(v) {
    if (v.type === 'ev') return 'kWh/100' + t('kmUnit');
    if (v.fuel === 'cng') return 'kg/100' + t('kmUnit');
    return 'L/100' + t('kmUnit');
  }
  function consumptionStep(v) {
    if (v.type === 'ev') return '1';
    return '0.5';
  }
  // Втора консумация (само за LPG/Хибрид)
  function hasSecondary(v) {
    return v.type !== 'ev' && (v.fuel === 'lpg' || v.fuel === 'hybrid');
  }
  function secondaryLabel(v) {
    if (v.fuel === 'lpg') return t('consLpgSecondary');     // бензин в LPG автомобил
    if (v.fuel === 'hybrid') return t('consHybridSecondary'); // ток в хибрид
    return '';
  }
  function secondaryUnit(v) {
    if (v.fuel === 'lpg') return 'L/100' + t('kmUnit');
    if (v.fuel === 'hybrid') return 'kWh/100' + t('kmUnit');
    return '';
  }
  function secondaryStep(v) {
    if (v.fuel === 'hybrid') return '1';
    return '0.5';
  }

  function vehicleCard(which) {
    const v = state[which];

        <div class="vc-ftype">${fuelTypeButtons(which)}</div>

        ${showHybridBase ? `
        <div class="vc-input-row">
          <label>${t('hybridBaseFuel')}</label>

            <button data-veh="${which}" data-hybridbase="petrol" class="vc-hybrid-btn ${v.hybridBaseFuel==='petrol'?'active':''}">${t('petrol')}</button>
            <button data-veh="${which}" data-hybridbase="diesel" class="vc-hybrid-btn ${v.hybridBaseFuel==='diesel'?'active':''}">${t('diesel')}</button>

        <div class="vc-input-row">
          <label>${t('purchasePrice')}</label>
          <input type="number" data-veh="${which}" data-field="purchase" value="${v.purchase}" min="0" step="1000">

        ${showSecondary ? `

        <details class="vc-collapse" open>
          <summary>${t('advanced')}</summary>

          </div>
          <div class="vc-input-row">
            <label>${t('insurance')}</label>
            <input type="number" data-veh="${which}" data-field="insurance" value="${v.insurance}" min="0" step="50">
            <span class="vc-unit">€${t('perYear')}</span>
          </div>
          <div class="vc-input-row">
            <label>${t('roadTax')}</label>
            <input type="number" data-veh="${which}" data-field="roadTax" value="${v.roadTax}" min="0" step="50">
            <span class="vc-unit">€${t('perYear')}</span>
          </div>
          <div class="vc-input-row">
            <label>${t('residual')}</label>
            <input type="number" data-veh="${which}" data-field="residualPct" value="${v.residualPct}" min="0" max="100" step="1">
            <span class="vc-unit">${t('ofPrice')}</span>
          </div>
        </details>
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ============ ГЛОБАЛНИ ПЛЪЗГАЧИ / GLOBAL SLIDERS ============
  function globalsHtml() {
    const usesLpg = state.v1.fuel === 'lpg' || state.v2.fuel === 'lpg';
    const usesCng = state.v1.fuel === 'cng' || state.v2.fuel === 'cng';

  // ============ РЕЗУЛТАТИ / METRICS, BREAK-EVEN, TOTALS ============
  function metricsHtml(d) {
    const c1 = d.c1, c2 = d.c2;
    // Сравнение на общ месечен разход (гориво + поддръжка/застраховка/тол на месечна база)
    const saveMonthly = c2.totalMonthly - c1.totalMonthly;
    const v1Wins = d.c2.grandTotal > d.c1.grandTotal;
    const totalDiff = Math.abs(c1.grandTotal - c2.grandTotal);
    const winnerName = v1Wins ? state.v1.name : state.v2.name;
    const loserSaveColor1 = saveMonthly > 0 ? '#5B8FBE' : '#C76A6A';
    const totalColor = v1Wins ? '#5B8FBE' : '#7BA85A';

    return `
      <div class="vc-metric">
        <div class="vc-metric-lbl">${state.v1.name}: ${t('opCostMonth')}</div>
        <div class="vc-metric-val">${eur(c1.totalMonthly)}</div>
        <div class="vc-metric-sub">${eur(c1.opMonth)} ${t('fuelShort')} + ${eur(c1.fixedYearly/12)} ${t('fixedShort')}</div>
      </div>
      <div class="vc-metric">
        <div class="vc-metric-lbl">${state.v2.name}: ${t('opCostMonth')}</div>
        <div class="vc-metric-val">${eur(c2.totalMonthly)}</div>
        <div class="vc-metric-sub">${eur(c2.opMonth)} ${t('fuelShort')} + ${eur(c2.fixedYearly/12)} ${t('fixedShort')}</div>

        <div class="vc-metric-lbl">${t('saveMonth')}</div>

        <div class="vc-metric-sub">${saveMonthly>0 ? t('inFavor1')+' '+state.v1.name : t('inFavor2')+' '+state.v2.name}</div>
      </div>
      <div class="vc-metric">
        <div class="vc-metric-lbl">${t('diff')} ${state.years} ${t('yrUnit')}</div>
        <div class="vc-metric-val" style="color:${totalColor}">${eur(totalDiff)}</div>
        <div class="vc-metric-sub">${winnerName} ${t('wins')}</div>

  }

  function beHtml(d) {
    if (d.beMonths !== null && isFinite(d.beMonths)) {

        <div>

          <div class="vc-be-big">${eur(Math.abs(d.purchaseDelta))}</div>

    return `<div class="vc-be-box">

        <div class="vc-be-sub">${t('atTheseFuel')}</div>

  }

  function totalsHtml(d) {
    function card(which, c) {
      const v = state[which];
      const klass = which === 'v1' ? 'v1' : 'v2';
      const consLabel = consumptionLabel(v);
      const consUnit = consumptionUnit(v);
      const fuelLabel = v.type === 'ev' ? t('elCost') : t('fuelCost');
      const dualFuel = hasSecondary(v);

      const secUnit = dualFuel ? secondaryUnit(v) : '';
      return `
        <div class="vc-total-card ${klass}">

          <div class="vc-summary-row"><span class="vc-summary-lbl">${consLabel}</span><span class="vc-summary-val">${v.consumption} ${consUnit}</span></div>
          ${dualFuel ? `<div class="vc-summary-row"><span class="vc-summary-lbl">${secLabel}</span><span class="vc-summary-val">${v.secondaryConsumption} ${secUnit}</span></div>` : ''}
          <div class="vc-summary-row"><span class="vc-summary-lbl">${fuelLabel}${t('perKm')}</span><span class="vc-summary-val">${ct(c.fuelKm)}${t('perKm')}</span></div>
          <div class="vc-summary-row"><span class="vc-summary-lbl">${t('fuelMonthly')}</span><span class="vc-summary-val">${eur(c.opMonth)}</span></div>
          <div class="vc-summary-row"><span class="vc-summary-lbl">${t('maintAnnual')}</span><span class="vc-summary-val">${eur(v.maintPerYear)}</span></div>
          <div class="vc-summary-row"><span class="vc-summary-lbl">${t('insAnnual')}</span><span class="vc-summary-val">${eur(v.insurance)}</span></div>
          <div class="vc-summary-row"><span class="vc-summary-lbl">${t('tollAnnual')}</span><span class="vc-summary-val">${eur(v.roadTax)}</span></div>
          <div class="vc-summary-row"><span class="vc-summary-lbl">${t('opYears')} ${state.years} ${t('yrUnit')}</span><span class="vc-summary-val">${eur(c.opTotal + c.fixedTotal)}</span></div>
          <div class="vc-summary-row"><span class="vc-summary-lbl">${t('netPurchase')}</span><span class="vc-summary-val">${eur(c.netPurchase)}</span></div>
          <div class="vc-summary-row"><span class="vc-summary-lbl">${t('residualEnd')}</span><span class="vc-summary-val">−${eur(c.residualValue)}</span></div>
          <div class="vc-summary-row" style="border-top:1px solid var(--color-border-secondary);margin-top:4px;padding-top:10px">
            <span class="vc-summary-lbl" style="font-weight:500">${t('grandTotal')} ${state.years} ${t('yrUnit')}</span>
            <span class="vc-summary-val" style="font-size:15px">${eur(c.grandTotal)}</span>
          </div>
        </div>
      `;
    }
    return card('v1', d.c1) + card('v2', d.c2);
  }

  function legendHtml() {
    return `
      <div class="vc-legend-item"><span class="vc-legend-line v1"></span>${escapeHtml(state.v1.name)}</div>
      <div class="vc-legend-item"><span class="vc-legend-line v2"></span>${escapeHtml(state.v2.name)}</div>
    `;
  }

  function winnerHtml(d) {
    const v1Wins = d.c2.grandTotal > d.c1.grandTotal;
    const winner = v1Wins ? state.v1 : state.v2;
    const klass = v1Wins ? 'w1' : 'w2';
    const icon = winner.type === 'ev' ? '⚡' : '⛽';
    const diff = Math.abs(d.c1.grandTotal - d.c2.grandTotal);
    return `<div class="vc-winner ${klass}">
      <span style="font-size:16px">${icon}</span>
      <span>${state.years} ${t('yrUnit')} · ${fmtKm(state.km)}${t('perMonth')} — <strong>${escapeHtml(winner.name)} ${t('moreFavorable')}</strong> ${eur(diff)}</span>
    </div>`;
  }

  // ============ ГРАФИКА / CHART ============
  let chart = null;

  // Помощник: създава вертикален градиент за областта под линията
  // Helper: builds a vertical gradient for the area fill under a line
  function makeAreaGradient(ctx, chartArea, hex) {
    if (!chartArea) return 'rgba(0,0,0,0)';
    const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
    // hex like '#5B8FBE' → rgba steps
    const r = parseInt(hex.slice(1,3),16), gC = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    g.addColorStop(0,    `rgba(${r},${gC},${b},0.28)`);
    g.addColorStop(0.55, `rgba(${r},${gC},${b},0.08)`);
    g.addColorStop(1,    `rgba(${r},${gC},${b},0.00)`);
    return g;
  }

  // Намира точката на пресичане на двете серии (break-even) — линейна интерполация
  // Finds where the two series intersect (break-even) — linear interpolation
  function findBreakEvenIndex(s1, s2) {
    let signPrev = Math.sign(s1[0] - s2[0]);
    if (signPrev === 0) return 0;
    for (let i = 1; i < s1.length; i++) {
      const sign = Math.sign(s1[i] - s2[i]);
      if (sign !== 0 && sign !== signPrev) {
        // линейна интерполация между i-1 и i
        const a = s1[i-1] - s2[i-1];
        const b = s1[i] - s2[i];
        const frac = a / (a - b);
        return (i - 1) + frac;
      }
      if (sign !== 0) signPrev = sign;
    }
    return null;
  }

  function renderChart(d) {
    const labels = [];
    const series1 = [];
    const series2 = [];
    const totalMonths = state.years * 12;
    for (let m = 0; m <= totalMonths; m++) {
      if (m === 0) {
        labels.push(t('start'));
      } else if (m % 12 === 0) {
        labels.push(t('yearShort') + ' ' + (m / 12));
      } else {
        labels.push('');
      }
      const yFrac = m / 12;
      const fracResidual1 = (m === totalMonths) ? d.c1.residualValue : 0;
      const fracResidual2 = (m === totalMonths) ? d.c2.residualValue : 0;
      series1.push(Math.round(d.c1.netPurchase + d.c1.opKm * d.kmYear * yFrac + d.c1.fixedYearly * yFrac - fracResidual1));
      series2.push(Math.round(d.c2.netPurchase + d.c2.opKm * d.kmYear * yFrac + d.c2.fixedYearly * yFrac - fracResidual2));
    }

    if (chart) chart.destroy();
    const canvas = document.getElementById('costChart');
    if (!canvas) return;
    const ctx2d = canvas.getContext('2d');

    const beIdx = findBreakEvenIndex(series1, series2);

    // Persistent (per-call) plugin: draws crosshair on hover and break-even marker
    const overlayPlugin = {
      id: 'vcOverlay',
      afterDatasetsDraw(c) {
        const {ctx, chartArea, scales} = c;
        if (!chartArea) return;

        // Break-even вертикална линия (ако се случва в диапазона)
        if (beIdx != null && beIdx > 0 && beIdx < series1.length - 0.001) {
          const xPx = scales.x.getPixelForValue(beIdx);
          ctx.save();
          ctx.strokeStyle = 'rgba(120,108,150,0.55)';
          ctx.setLineDash([4,4]);
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(xPx, chartArea.top);
          ctx.lineTo(xPx, chartArea.bottom);
          ctx.stroke();

          // Точка на пресичане
          const yVal = series1[Math.floor(beIdx)] + (series1[Math.ceil(beIdx)] - series1[Math.floor(beIdx)]) * (beIdx - Math.floor(beIdx));
          const yPx = scales.y.getPixelForValue(yVal);
          ctx.setLineDash([]);
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#7B6C96';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(xPx, yPx, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Етикет "Break-even" над линията
          const beYears = beIdx / 12;
          const beLabel = (lang === 'bg' ? 'Изравняване' : 'Break-even') + ' · ' + beYears.toFixed(1) + ' ' + t('yrShort');
          ctx.font = '600 11px Barlow, system-ui, sans-serif';
          const textW = ctx.measureText(beLabel).width;
          // Поставяме етикета така, че да не излиза извън графиката
          let lx = xPx + 8;
          if (lx + textW + 10 > chartArea.right) lx = xPx - textW - 18;
          const ly = chartArea.top + 6;
          ctx.fillStyle = 'rgba(123,108,150,0.95)';
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(lx, ly, textW + 12, 18, 4);
          } else {
            ctx.rect(lx, ly, textW + 12, 18);
          }
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.textBaseline = 'middle';
          ctx.fillText(beLabel, lx + 6, ly + 9);
          ctx.restore();
        }

        // Вертикална линия на курсора (crosshair)
        const active = c.tooltip && c.tooltip.getActiveElements && c.tooltip.getActiveElements();
        if (active && active.length) {
          const xPx = active[0].element.x;
          ctx.save();
          ctx.strokeStyle = 'rgba(80,70,110,0.22)';
          ctx.setLineDash([3,3]);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(xPx, chartArea.top);
          ctx.lineTo(xPx, chartArea.bottom);
          ctx.stroke();
          ctx.restore();
        }
      }
    };

    chart = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: state.v1.name,
            data: series1,
            borderColor: '#5B8FBE',
            backgroundColor: (c) => makeAreaGradient(ctx2d, c.chart.chartArea, '#5B8FBE'),
            fill: true,
            tension: 0.28,
            pointRadius: 0,
            pointHoverRadius: 6,
            pointHoverBackgroundColor: '#5B8FBE',
            pointHoverBorderColor: '#fff',
            pointHoverBorderWidth: 2.5,
            borderWidth: 3
          },
          {
            label: state.v2.name,
            data: series2,
            borderColor: '#7BA85A',
            backgroundColor: (c) => makeAreaGradient(ctx2d, c.chart.chartArea, '#7BA85A'),
            fill: true,
            tension: 0.28,
            pointRadius: 0,
            pointHoverRadius: 6,
            pointHoverBackgroundColor: '#7BA85A',
            pointHoverBorderColor: '#fff',
            pointHoverBorderWidth: 2.5,
            borderWidth: 3
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        animation: { duration: 350, easing: 'easeOutCubic' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(40, 32, 60, 0.94)',
            titleColor: '#fff',
            titleFont: { size: 12, weight: '600' },
            bodyColor: '#E8E3F0',
            bodyFont: { size: 12 },
            padding: 10,
            cornerRadius: 8,
            displayColors: true,
            boxWidth: 8,
            boxHeight: 8,
            boxPadding: 4,
            usePointStyle: true,
            callbacks: {
              title: items => {
                const m = items[0].dataIndex;
                if (m === 0) return t('start');
                const yr = Math.floor(m / 12);
                const mo = m % 12;
                if (yr === 0) return mo + ' ' + t('moShort');
                if (mo === 0) return yr + ' ' + t('yrShort');
                return yr + ' ' + t('yrShort') + ' ' + mo + ' ' + t('moShort');
              },
              label: c => '  ' + c.dataset.label + ': ' + Math.round(c.parsed.y).toLocaleString(locale()) + ' €',
              afterBody: items => {
                if (items.length < 2) return '';
                const a = items[0].parsed.y, b = items[1].parsed.y;
                const diff = Math.abs(a - b);
                const leader = a < b ? items[0].dataset.label : items[1].dataset.label;
                const diffLbl = lang === 'bg' ? 'Разлика' : 'Difference';
                return ['', diffLbl + ': ' + Math.round(diff).toLocaleString(locale()) + ' € (' + leader + ')'];
              }
            }
          }
        },
        scales: {
          y: {
            ticks: { callback: v => (v/1000).toFixed(0) + 'k €', font:{size:11}, color:'#7B7290' },
            grid: { color: 'rgba(120,108,150,0.10)', drawTicks:false },
            border: { display:false }
          },
          x: {
            ticks: {
              font:{size:11},
              color:'#7B7290',
              autoSkip:false,
              maxRotation:0,
              callback: function(value) {
                const lbl = this.getLabelForValue(value);
                return lbl === '' ? null : lbl;
              }
            },
            grid: { display:false },
            border: { color: 'rgba(120,108,150,0.18)' }
          }
        }
      },
      plugins: [overlayPlugin]
    });
    canvas.setAttribute('aria-label', t('ariaChart'));
  }

  // ============ ОСНОВНО РЕНДЕРИРАНЕ / MAIN RENDER ============
  function renderAll() {
    document.getElementById('lblVehicles').textContent = t('vehicles');
    document.getElementById('lblParams').textContent = t('params');
    document.getElementById('lblResults').textContent = t('results');
    document.getElementById('srTitle').textContent =
      lang === 'bg'
        ? 'Универсален финансов калкулатор за сравнение на две превозни средства'
        : 'Universal Financial Comparison Calculator for Two Vehicles';

    document.getElementById('vehicleCards').innerHTML = vehicleCard('v1') + vehicleCard('v2');
    document.getElementById('globals').innerHTML = globalsHtml();

    const d = calc();
    document.getElementById('metrics').innerHTML = metricsHtml(d);
    document.getElementById('beArea').innerHTML = beHtml(d);
    document.getElementById('totals').innerHTML = totalsHtml(d);
    document.getElementById('legend').innerHTML = legendHtml();
    document.getElementById('winnerArea').innerHTML = winnerHtml(d);
    renderChart(d);

    // Sync share button label to active language
    const sbl = document.getElementById('shareBtnLbl');
    if (sbl && !document.getElementById('shareBtn').classList.contains('copied')) {
      sbl.textContent = t('share');
    }

    attachInputHandlers();
    scheduleUrlUpdate();
  }

  // ============ ОБРАБОТКА НА ВЪВЕЖДАНЕ / INPUT HANDLERS ============
  function attachInputHandlers() {
    // Имена на превозни средства и числа в карти
    document.querySelectorAll('input[data-veh]').forEach(inp => {
      inp.addEventListener('input', e => {
        const veh = e.target.dataset.veh;
        const field = e.target.dataset.field;
        if (field === 'name') {
          state[veh][field] = e.target.value;
          // Лек ре-рендер само за зависими секции (без да губим фокуса)
          partialRender();
        } else {
          const val = parseFloat(e.target.value);
          if (!isNaN(val)) {
            state[veh][field] = val;
            partialRender();
          }
        }
      });
    });

    // Бутони за тип гориво
    document.querySelectorAll('button[data-fuel]').forEach(btn => {
      btn.addEventListener('click', e => {
        const veh = e.currentTarget.dataset.veh;
        const fuel = e.currentTarget.dataset.fuel;
        const cat = e.currentTarget.dataset.cat;
        const v = state[veh];
        const oldType = v.type;
        const oldFuel = v.fuel;
        v.fuel = fuel;
        v.type = cat;
        // Задаваме разумни стойности по подразбиране при смяна
        if (oldType !== cat || oldFuel !== fuel) {
          if (cat === 'ev') {
            v.consumption = 22; // 130 kWh/100км типично за камион; за кола ~18-22
            v.secondaryConsumption = 0;
          } else if (fuel === 'lpg') {
            v.consumption = 12;            // LPG л/100км (типично за лек автомобил)
            v.secondaryConsumption = 0.5;  // пилотен бензин
          } else if (fuel === 'hybrid') {
            v.consumption = 5;             // бензин л/100км
            v.secondaryConsumption = 8;    // ток kWh/100км
          } else if (fuel === 'cng') {
            v.consumption = 8;             // кг/100км
            v.secondaryConsumption = 0;
          } else {
            // дизел / бензин
            v.consumption = (oldType === 'ev') ? 7 : v.consumption;
            v.secondaryConsumption = 0;
          }
        }
        renderAll();
      });
    });

    // Бутони за основно гориво на хибрид
    document.querySelectorAll('button[data-hybridbase]').forEach(btn => {
      btn.addEventListener('click', e => {
        const veh = e.currentTarget.dataset.veh;
        const base = e.currentTarget.dataset.hybridbase;
        state[veh].hybridBaseFuel = base;
        renderAll();
      });
    });

    // Глобални плъзгачи
    document.querySelectorAll('input[data-global]').forEach(inp => {
      inp.addEventListener('input', e => {
        const f = e.target.dataset.global;
        state[f] = parseFloat(e.target.value);
        partialRender();
      });
    });
  }

  function partialRender() {
    // Опресняване на стойностите на плъзгачите
    const kmOut = document.getElementById('km-out');
    const fpOut = document.getElementById('fp-out');
    const epOut = document.getElementById('ep-out');
    const yrOut = document.getElementById('yr-out');
    const lpgOut = document.getElementById('lpg-out');
    const cngOut = document.getElementById('cng-out');
    if (kmOut) kmOut.textContent = fmtKm(state.km);
    if (fpOut) fpOut.textContent = state.fuelPrice.toFixed(2) + ' ' + t('lUnit');
    if (epOut) epOut.textContent = state.elPrice.toFixed(2) + ' ' + t('mwhUnit');
    if (yrOut) yrOut.textContent = state.years + ' ' + t('yrUnit');
    if (lpgOut) lpgOut.textContent = state.lpgPrice.toFixed(2) + ' ' + t('lUnit');
    if (cngOut) cngOut.textContent = state.cngPrice.toFixed(2) + ' ' + t('kgUnit');

    const d = calc();
    document.getElementById('metrics').innerHTML = metricsHtml(d);
    document.getElementById('beArea').innerHTML = beHtml(d);
    document.getElementById('totals').innerHTML = totalsHtml(d);
    document.getElementById('legend').innerHTML = legendHtml();
    document.getElementById('winnerArea').innerHTML = winnerHtml(d);
    renderChart(d);
    scheduleUrlUpdate();
  }

  // ============ URL СПОДЕЛЯНЕ / URL SHARING ============
  // Кратки ключове за компактни URL адреси
  // Short keys to keep URLs compact
  const URL_KEYS = {
    // per-vehicle fields → 2-letter suffix
    name:'n', type:'t', fuel:'f', hybridBaseFuel:'hb',
    purchase:'p', subsidy:'s', consumption:'c', secondaryConsumption:'sc',
    maintPerYear:'m', insurance:'i', roadTax:'rt', residualPct:'r',
    // globals
    km:'km', fuelPrice:'fp', lpgPrice:'lp', cngPrice:'cp', elPrice:'ep', years:'y',
    lang:'l'
  };

  function encodeStateToUrl() {
    const params = new URLSearchParams();
    const writeVeh = (prefix, v) => {
      Object.keys(v).forEach(k => {
        const short = URL_KEYS[k];
        if (!short) return;
        const val = v[k];
        if (val === undefined || val === null || val === '') return;
        params.set(prefix + short, String(val));
      });
    };
    writeVeh('1', state.v1);
    writeVeh('2', state.v2);
    ['km','fuelPrice','lpgPrice','cngPrice','elPrice','years'].forEach(k => {
      params.set(URL_KEYS[k], String(state[k]));
    });
    params.set(URL_KEYS.lang, lang);
    const qs = params.toString();
    const newUrl = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
    try { history.replaceState(null, '', newUrl); } catch (_) { /* sandboxed iframes may block */ }
  }

  function decodeStateFromUrl() {
    let params;
    try { params = new URLSearchParams(window.location.search); }
    catch (_) { return; }
    if (!params || ![...params.keys()].length) return;

    const numFields = new Set(['purchase','subsidy','consumption','secondaryConsumption',
      'maintPerYear','insurance','roadTax','residualPct',
      'km','fuelPrice','lpgPrice','cngPrice','elPrice','years']);

    const readVeh = (prefix, v) => {
      Object.keys(URL_KEYS).forEach(k => {
        if (!(k in v)) return;
        const short = URL_KEYS[k];
        const raw = params.get(prefix + short);
        if (raw === null) return;
        if (numFields.has(k)) {
          const n = parseFloat(raw);
          if (!isNaN(n)) v[k] = n;
        } else {
          v[k] = raw;
        }
      });
    };
    readVeh('1', state.v1);
    readVeh('2', state.v2);

    ['km','fuelPrice','lpgPrice','cngPrice','elPrice','years'].forEach(k => {
      const raw = params.get(URL_KEYS[k]);
      if (raw === null) return;
      const n = parseFloat(raw);
      if (!isNaN(n)) state[k] = n;
    });

    const langRaw = params.get(URL_KEYS.lang);
    if (langRaw === 'bg' || langRaw === 'en') lang = langRaw;
  }

  // Дебоунс — пишем URL не по-често от 1 път на 250мс
  // Debounce — write URL at most every 250ms
  let urlTimer = null;
  function scheduleUrlUpdate() {
    if (urlTimer) clearTimeout(urlTimer);
    urlTimer = setTimeout(encodeStateToUrl, 250);
  }

  // ============ ПРЕВКЛЮЧВАТЕЛ НА ЕЗИК / LANGUAGE TOGGLE ============
  document.querySelectorAll('.vc-lang button').forEach(btn => {
    btn.addEventListener('click', e => {
      const newLang = e.currentTarget.dataset.lang;
      if (newLang === lang) return;
      lang = newLang;
      document.querySelectorAll('.vc-lang button').forEach(b => {
        const act = b.dataset.lang === lang;
        b.classList.toggle('active', act);
        b.setAttribute('aria-pressed', act ? 'true' : 'false');
      });
      // Ако имената са били оставени по подразбиране — обнови ги
      if (state.v1.name === T.bg.v1Default || state.v1.name === T.en.v1Default) state.v1.name = t('v1Default');
      if (state.v2.name === T.bg.v2Default || state.v2.name === T.en.v2Default) state.v2.name = t('v2Default');
      renderAll();
    });
  });

  // ============ ИНИЦИАЛИЗАЦИЯ / INIT ============
  // Прочети състоянието от URL (ако има), след това попълни имена по подразбиране
  // Read state from URL (if any), then fill default names
  decodeStateFromUrl();

  // Sync language toggle UI to decoded language
  document.querySelectorAll('.vc-lang button').forEach(b => {
    const act = b.dataset.lang === lang;
    b.classList.toggle('active', act);
    b.setAttribute('aria-pressed', act ? 'true' : 'false');
  });

  if (!state.v1.name) state.v1.name = t('v1Default');
  if (!state.v2.name) state.v2.name = t('v2Default');

  // Бутон за споделяне — копира текущия URL в клипборда
  // Share button — copies current URL to clipboard
  const shareBtn = document.getElementById('shareBtn');
  if (shareBtn) {
    shareBtn.addEventListener('click', async () => {
      // Принудително синхронизиране, в случай че има висящ дебоунс
      if (urlTimer) { clearTimeout(urlTimer); urlTimer = null; }
      encodeStateToUrl();
      const url = window.location.href;
      const lbl = document.getElementById('shareBtnLbl');
      const showCopied = () => {
        shareBtn.classList.add('copied');
        if (lbl) lbl.textContent = t('shareCopied');
        setTimeout(() => {
          shareBtn.classList.remove('copied');
          if (lbl) lbl.textContent = t('share');
        }, 1800);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(url);
          showCopied();
        } else {
          // Резервен метод — стар подход през textarea
          const ta = document.createElement('textarea');
          ta.value = url;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showCopied();
        }
      } catch (_) {
        // Ако всичко друго се провали — покажи URL за ръчно копиране
        window.prompt('Copy share link:', url);
      }
    });
  }

  renderAll();
})();
</script>
